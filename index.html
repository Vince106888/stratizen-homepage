<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratizen | Student-Owned Digital Infrastructure</title>

    <meta
      name="description"
      content="Student-owned digital infrastructure for collaboration, opportunity, and coordination at Strathmore University."
    />
    <meta name="author" content="Stratizen Team" />
    <meta name="theme-color" content="#002147" />

    <meta property="og:title" content="Stratizen | Student-Owned Digital Infrastructure" />
    <meta
      property="og:description"
      content="Student-owned digital infrastructure for collaboration, opportunity, and coordination at Strathmore University."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stratizen.netlify.app" />
    <meta property="og:image" content="/og/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/images/hero-strath.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-bg text-text dark:bg-[var(--color-bg)] dark:text-[var(--color-text)] transition-colors duration-300 font-sans">
    <div id="root"></div>

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <form name="join" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="role" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
